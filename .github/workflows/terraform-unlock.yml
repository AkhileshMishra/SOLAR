name: Terraform Force Unlock

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: "Terraform lock ID from error message"
        required: true
        default: "db7907dd-3947-805c-135a-b34bea9f22a7"

jobs:
  force-unlock:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::430118833069:role/KAIZERODeploymentServer
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=terraform-state-430118833069" \
            -backend-config="key=compliance-reporting/terraform.tfstate" \
            -backend-config="region=ap-southeast-1" \
            -backend-config="dynamodb_table=terraform-locks-430118833069"

      - name: Terraform force-unlock
        run: terraform force-unlock -force ${{ github.event.inputs.lock_id }}

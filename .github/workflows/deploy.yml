name: Deploy Infrastructure and Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - force-unlock
      lock_id:
        description: 'Terraform lock ID (required for force-unlock)'
        required: false

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.5.7"
  STATE_BUCKET_PREFIX: "solar-terraform-state"
  LOCK_TABLE_NAME: "solar-terraform-lock"

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================================
  # Force Unlock Job (Manual Trigger Only)
  # ============================================================================
  force-unlock:
    name: Force Unlock Terraform State
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'force-unlock'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Account ID and Setup Backend
        id: setup
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="${STATE_BUCKET_PREFIX}-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.setup.outputs.STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.LOCK_TABLE_NAME }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Force Unlock
        run: |
          if [ -z "${{ github.event.inputs.lock_id }}" ]; then
            echo "Error: lock_id is required for force-unlock action"
            exit 1
          fi
          terraform force-unlock -force ${{ github.event.inputs.lock_id }}
          echo "✓ Terraform state unlocked successfully"

  # ============================================================================
  # Deploy Job - Standard Terraform Workflow
  # ============================================================================
  # IMPORTANT: This workflow NEVER modifies Terraform state directly.
  # - NO terraform state rm commands
  # - NO terraform import commands
  # - State is managed purely by Terraform plan/apply
  # - State is stored in S3 with DynamoDB locking
  # ============================================================================
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy' || github.event.inputs.action == ''
    
    steps:
      # ----------------------------------------
      # 1. Checkout Repository
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Configure AWS Credentials via OIDC
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # 3. Bootstrap Terraform Backend
      # ----------------------------------------
      - name: Bootstrap Terraform State Backend
        id: bootstrap
        run: |
          # Get AWS Account ID
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="${STATE_BUCKET_PREFIX}-${ACCOUNT_ID}"
          
          echo "Account ID: ${ACCOUNT_ID}"
          echo "State Bucket: ${STATE_BUCKET}"
          echo "Lock Table: ${LOCK_TABLE_NAME}"
          
          # Check and create S3 bucket if not exists
          if ! aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null; then
            echo "Creating S3 bucket for Terraform state..."
            aws s3api create-bucket \
              --bucket "${STATE_BUCKET}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "${STATE_BUCKET}" \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "${STATE_BUCKET}" \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }]
              }'
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket "${STATE_BUCKET}" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "✓ S3 bucket created successfully"
          else
            echo "✓ S3 bucket already exists"
          fi

          # Check and create DynamoDB table if not exists
          if ! aws dynamodb describe-table --table-name "${LOCK_TABLE_NAME}" 2>/dev/null; then
            echo "Creating DynamoDB table for state locking..."
            aws dynamodb create-table \
              --table-name "${LOCK_TABLE_NAME}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${AWS_REGION}"
            
            # Wait for table to be active
            aws dynamodb wait table-exists --table-name "${LOCK_TABLE_NAME}"
            echo "✓ DynamoDB table created successfully"
          else
            echo "✓ DynamoDB table already exists"
          fi
          
          # Export variables for subsequent steps
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_OUTPUT
          echo "LOCK_TABLE=${LOCK_TABLE_NAME}" >> $GITHUB_OUTPUT
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      # ----------------------------------------
      # 4. Setup Python for Layer Building
      # ----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----------------------------------------
      # 5. Build Lambda Layers
      # ----------------------------------------
      - name: Build Lambda Layers
        run: |
          chmod +x scripts/build_layers.sh
          ./scripts/build_layers.sh

      # ----------------------------------------
      # 6. Setup Node.js for Frontend Build
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ----------------------------------------
      # 7. Build Frontend (Initial Build)
      # ----------------------------------------
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # ----------------------------------------
      # 8. Setup Terraform
      # ----------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ----------------------------------------
      # 9. Terraform Init
      # ----------------------------------------
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.bootstrap.outputs.STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # ----------------------------------------
      # 10. Pre-Apply Cleanup (Handle Orphaned Resources)
      # ----------------------------------------
      # This step handles edge cases where resources exist in AWS but not in Terraform state
      # (e.g., from partial deployments or manual changes)
      - name: Pre-Apply Cleanup
        run: |
          echo "Checking for orphaned Bedrock resources..."
          
          # Find any existing ComplianceAuditorAgent
          AGENT_ID=$(aws bedrock-agent list-agents --region ${{ env.AWS_REGION }} \
            --query "agentSummaries[?agentName=='ComplianceAuditorAgent'].agentId" \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$AGENT_ID" ] && [ "$AGENT_ID" != "None" ]; then
            echo "Found existing agent: $AGENT_ID"
            
            # Disassociate any existing KB associations for DRAFT version
            KB_IDS=$(aws bedrock-agent list-agent-knowledge-bases \
              --agent-id $AGENT_ID \
              --agent-version DRAFT \
              --region ${{ env.AWS_REGION }} \
              --query "agentKnowledgeBaseSummaries[*].knowledgeBaseId" \
              --output text 2>/dev/null || echo "")
            
            for KB_ID in $KB_IDS; do
              if [ -n "$KB_ID" ] && [ "$KB_ID" != "None" ]; then
                echo "Disassociating orphaned KB: $KB_ID from agent: $AGENT_ID"
                aws bedrock-agent disassociate-agent-knowledge-base \
                  --agent-id $AGENT_ID \
                  --agent-version DRAFT \
                  --knowledge-base-id $KB_ID \
                  --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Already disassociated or not found"
              fi
            done
          else
            echo "No existing agent found, skipping cleanup"
          fi
          
          echo "✓ Pre-apply cleanup complete"

      # ----------------------------------------
      # 11. Terraform Plan
      # ----------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # ----------------------------------------
      # 12. Terraform Apply
      # ----------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # ----------------------------------------
      # 12.5 Prepare Bedrock Agent (Required after schema changes)
      # ----------------------------------------
      - name: Prepare Bedrock Agent
        run: |
          AGENT_ID=$(terraform output -raw bedrock_agent_id)
          echo "Preparing agent: $AGENT_ID"
          
          aws bedrock-agent prepare-agent \
            --agent-id $AGENT_ID \
            --region ${{ env.AWS_REGION }}
          
          echo "Waiting for agent to be prepared..."
          sleep 30
          
          echo "✓ Agent prepared successfully"

      # ----------------------------------------
      # 12.6 Sync Knowledge Bases
      # ----------------------------------------
      - name: Sync Knowledge Bases
        run: |
          # Sync Policy KB
          POLICY_KB_ID=$(terraform output -raw knowledge_base_id)
          POLICY_DS_ID=$(terraform output -raw knowledge_base_data_source_id)
          
          echo "Syncing Policy Knowledge Base: $POLICY_KB_ID"
          aws bedrock-agent start-ingestion-job \
            --knowledge-base-id $POLICY_KB_ID \
            --data-source-id $POLICY_DS_ID \
            --region ${{ env.AWS_REGION }} || echo "Policy KB sync skipped (may already be running)"
          
          # Sync SOC2 KB
          SOC2_KB_ID=$(terraform output -raw soc2_knowledge_base_id 2>/dev/null || echo "")
          SOC2_DS_ID=$(terraform output -raw soc2_knowledge_base_data_source_id 2>/dev/null || echo "")
          
          if [ -n "$SOC2_KB_ID" ] && [ -n "$SOC2_DS_ID" ]; then
            echo "Syncing SOC2 Knowledge Base: $SOC2_KB_ID"
            aws bedrock-agent start-ingestion-job \
              --knowledge-base-id $SOC2_KB_ID \
              --data-source-id $SOC2_DS_ID \
              --region ${{ env.AWS_REGION }} || echo "SOC2 KB sync skipped (may already be running)"
          fi
          
          echo "✓ Knowledge Base sync jobs started"

      # ----------------------------------------
      # 13. Get Terraform Outputs
      # ----------------------------------------
      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)
          CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)
          CLOUDFRONT_URL=$(terraform output -raw cloudfront_url)
          COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)
          COGNITO_WEB_CLIENT_ID=$(terraform output -raw cognito_web_client_id)
          COGNITO_IDENTITY_POOL_ID=$(terraform output -raw cognito_identity_pool_id)
          
          echo "FRONTEND_BUCKET=${FRONTEND_BUCKET}" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_ID=${CLOUDFRONT_ID}" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_URL=${CLOUDFRONT_URL}" >> $GITHUB_OUTPUT
          echo "COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}" >> $GITHUB_OUTPUT
          echo "COGNITO_WEB_CLIENT_ID=${COGNITO_WEB_CLIENT_ID}" >> $GITHUB_OUTPUT
          echo "COGNITO_IDENTITY_POOL_ID=${COGNITO_IDENTITY_POOL_ID}" >> $GITHUB_OUTPUT

      # ----------------------------------------
      # 14. Update Frontend Config with Cognito
      # ----------------------------------------
      - name: Update Frontend Config
        run: |
          cat > frontend/src/aws-exports.js << EOF
          const awsConfig = {
              Auth: {
                  region: "${{ env.AWS_REGION }}",
                  userPoolId: "${{ steps.tf_outputs.outputs.COGNITO_USER_POOL_ID }}",
                  userPoolWebClientId: "${{ steps.tf_outputs.outputs.COGNITO_WEB_CLIENT_ID }}",
                  identityPoolId: "${{ steps.tf_outputs.outputs.COGNITO_IDENTITY_POOL_ID }}",
              }
          };
          
          export default awsConfig;
          EOF
          echo "✓ Updated aws-exports.js with Cognito configuration"

      # ----------------------------------------
      # 15. Rebuild Frontend with Updated Config
      # ----------------------------------------
      - name: Rebuild Frontend
        working-directory: frontend
        run: npm run build

      # ----------------------------------------
      # 16. Deploy Frontend to S3
      # ----------------------------------------
      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend/build/ s3://${{ steps.tf_outputs.outputs.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "index.html" \
            --exclude "*.json"
          
          # Upload index.html with no-cache
          aws s3 cp frontend/build/index.html s3://${{ steps.tf_outputs.outputs.FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"
          
          # Upload JSON config files with no-cache
          find frontend/build -name "*.json" -exec aws s3 cp {} s3://${{ steps.tf_outputs.outputs.FRONTEND_BUCKET }}/ \
            --cache-control "no-cache,no-store,must-revalidate" \; 2>/dev/null || true

      # ----------------------------------------
      # 17. Invalidate CloudFront Cache
      # ----------------------------------------
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.CLOUDFRONT_ID }} \
            --paths "/*"

      # ----------------------------------------
      # 18. Deployment Summary
      # ----------------------------------------
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "🚀 Deployment Complete!"
          echo "=========================================="
          echo ""
          echo "Frontend URL: https://${{ steps.tf_outputs.outputs.CLOUDFRONT_URL }}"
          echo ""
          echo "AWS Account: ${{ steps.bootstrap.outputs.ACCOUNT_ID }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "Terraform State: s3://${{ steps.bootstrap.outputs.STATE_BUCKET }}/terraform.tfstate"
          echo "=========================================="

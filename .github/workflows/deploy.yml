name: Deploy Infrastructure and Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - force-unlock
      lock_id:
        description: 'Terraform lock ID (required for force-unlock)'
        required: false
        default: 'db7907dd-3947-805c-135a-b34bea9f22a7'


env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.5.7"
  STATE_BUCKET_PREFIX: "solar-terraform-state"
  LOCK_TABLE_NAME: "solar-terraform-lock"

permissions:
  id-token: write
  contents: read

jobs:
  force-unlock:
    name: Force Unlock Terraform State
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'force-unlock'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Account ID and Setup Backend
        id: setup
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="${STATE_BUCKET_PREFIX}-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.setup.outputs.STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.LOCK_TABLE_NAME }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Force Unlock
        run: |
          if [ -z "${{ github.event.inputs.lock_id }}" ]; then
            echo "Error: lock_id is required for force-unlock action"
            exit 1
          fi
          terraform force-unlock -force ${{ github.event.inputs.lock_id }}
          echo "✓ Terraform state unlocked successfully"

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy' || github.event.inputs.action == ''
    
    steps:
      # ============================================
      # 1. Checkout Repository
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 2. Configure AWS Credentials via OIDC
      # ============================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================
      # 3. Bootstrap Terraform Backend
      # ============================================
      - name: Bootstrap Terraform State Backend
        id: bootstrap
        run: |
          # Get AWS Account ID
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="${STATE_BUCKET_PREFIX}-${ACCOUNT_ID}"
          
          echo "Account ID: ${ACCOUNT_ID}"
          echo "State Bucket: ${STATE_BUCKET}"
          echo "Lock Table: ${LOCK_TABLE_NAME}"
          
          # Check and create S3 bucket if not exists
          if ! aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null; then
            echo "Creating S3 bucket for Terraform state..."
            aws s3api create-bucket \
              --bucket "${STATE_BUCKET}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "${STATE_BUCKET}" \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "${STATE_BUCKET}" \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }]
              }'
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket "${STATE_BUCKET}" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "✓ S3 bucket created successfully"
          else
            echo "✓ S3 bucket already exists"
          fi

          # Check and create DynamoDB table if not exists
          if ! aws dynamodb describe-table --table-name "${LOCK_TABLE_NAME}" 2>/dev/null; then
            echo "Creating DynamoDB table for state locking..."
            aws dynamodb create-table \
              --table-name "${LOCK_TABLE_NAME}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${AWS_REGION}"
            
            # Wait for table to be active
            aws dynamodb wait table-exists --table-name "${LOCK_TABLE_NAME}"
            echo "✓ DynamoDB table created successfully"
          else
            echo "✓ DynamoDB table already exists"
          fi
          
          # Export variables for subsequent steps
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_OUTPUT
          echo "LOCK_TABLE=${LOCK_TABLE_NAME}" >> $GITHUB_OUTPUT
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      # ============================================
      # 4. Setup Python for Layer Building
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================
      # 5. Build Lambda Layers
      # ============================================
      - name: Build Lambda Layers
        run: |
          chmod +x scripts/build_layers.sh
          ./scripts/build_layers.sh

      # ============================================
      # 6. Setup Node.js for Frontend Build
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ============================================
      # 7. Build Frontend
      # ============================================
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # ============================================
      # 8. Setup Terraform
      # ============================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ============================================
      # 9. Terraform Init with Dynamic Backend
      # ============================================
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.bootstrap.outputs.STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # ============================================
      # 10. Cleanup Terraform State (Remove orphaned resources)
      # ============================================
      - name: Cleanup Terraform State
        run: |
          echo "Removing orphaned resources from Terraform state..."
          # Remove the old opensearch_index resource if it exists in state
          terraform state rm opensearch_index.kb_default_index 2>/dev/null || echo "opensearch_index.kb_default_index not in state"
          # Remove the old collection if it exists in state but not in AWS
          terraform state rm aws_opensearchserverless_collection.kb_collection 2>/dev/null || echo "Collection not in state or already removed"
          # Remove orphaned Bedrock Data Source if it exists in state but not in AWS
          terraform state rm aws_bedrockagent_data_source.policy_documents 2>/dev/null || echo "Data source not in state or already removed"
          # Remove orphaned Bedrock Knowledge Base if it exists in state but not in AWS
          terraform state rm aws_bedrockagent_knowledge_base.compliance_kb 2>/dev/null || echo "Knowledge base not in state or already removed"
          # Remove orphaned Knowledge Base association if it exists in state
          terraform state rm aws_bedrockagent_agent_knowledge_base_association.compliance_policy 2>/dev/null || echo "KB association not in state or already removed"
          echo "State cleanup complete"

      # ============================================
      # 11. Terraform Plan
      # ============================================
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # ============================================
      # 12. Terraform Apply
      # ============================================
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # ============================================
      # 13. Get Terraform Outputs
      # ============================================
      - name: Get Terraform Outputs
        id: tf_outputs
        run: |
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)
          CLOUDFRONT_ID=$(terraform output -raw cloudfront_distribution_id)
          CLOUDFRONT_URL=$(terraform output -raw cloudfront_url)
          COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)
          COGNITO_WEB_CLIENT_ID=$(terraform output -raw cognito_web_client_id)
          COGNITO_IDENTITY_POOL_ID=$(terraform output -raw cognito_identity_pool_id)
          
          echo "FRONTEND_BUCKET=${FRONTEND_BUCKET}" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_ID=${CLOUDFRONT_ID}" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_URL=${CLOUDFRONT_URL}" >> $GITHUB_OUTPUT
          echo "COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}" >> $GITHUB_OUTPUT
          echo "COGNITO_WEB_CLIENT_ID=${COGNITO_WEB_CLIENT_ID}" >> $GITHUB_OUTPUT
          echo "COGNITO_IDENTITY_POOL_ID=${COGNITO_IDENTITY_POOL_ID}" >> $GITHUB_OUTPUT

      # ============================================
      # 14. Update Frontend Config with Cognito Values
      # ============================================
      - name: Update Frontend Config
        run: |
          cat > frontend/src/aws-exports.js << EOF
          const awsConfig = {
              Auth: {
                  region: "${{ env.AWS_REGION }}",
                  userPoolId: "${{ steps.tf_outputs.outputs.COGNITO_USER_POOL_ID }}",
                  userPoolWebClientId: "${{ steps.tf_outputs.outputs.COGNITO_WEB_CLIENT_ID }}",
                  identityPoolId: "${{ steps.tf_outputs.outputs.COGNITO_IDENTITY_POOL_ID }}",
              }
          };
          
          export default awsConfig;
          EOF
          echo "Updated aws-exports.js with Cognito configuration"
          cat frontend/src/aws-exports.js

      # ============================================
      # 15. Rebuild Frontend with Updated Config
      # ============================================
      - name: Rebuild Frontend
        working-directory: frontend
        run: |
          npm run build

      # ============================================
      # 15. Deploy Frontend to S3
      # ============================================
      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend/build/ s3://${{ steps.tf_outputs.outputs.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "index.html" \
            --exclude "*.json"
          
          # Upload index.html and JSON files with no-cache
          aws s3 cp frontend/build/index.html s3://${{ steps.tf_outputs.outputs.FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"
          
          # Upload any JSON config files with no-cache
          find frontend/build -name "*.json" -exec aws s3 cp {} s3://${{ steps.tf_outputs.outputs.FRONTEND_BUCKET }}/ \
            --cache-control "no-cache,no-store,must-revalidate" \; 2>/dev/null || true

      # ============================================
      # 16. Invalidate CloudFront Cache
      # ============================================
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.CLOUDFRONT_ID }} \
            --paths "/*"

      # ============================================
      # 17. Deployment Summary
      # ============================================
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "🚀 Deployment Complete!"
          echo "=========================================="
          echo ""
          echo "Frontend URL: https://${{ steps.tf_outputs.outputs.CLOUDFRONT_URL }}"
          echo ""
          echo "AWS Account: ${{ steps.bootstrap.outputs.ACCOUNT_ID }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "=========================================="
